<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Primary Meta Tags -->
  <title>Overnight Cafe</title>
  <meta name="title" content="Overnight Cafe">
  <meta name="description" content="Sip, Savour & Stay Overnight. Order online or walk-in at Overnight Cafe.">

  <!-- Open Graph / Facebook / Messenger / Viber / GCash / iMessage -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://overnightcafe-app.web.app/">
  <meta property="og:title" content="Overnight Cafe">
  <meta property="og:description" content="Sip, Savour & Stay Overnight. Order online or walk-in at Overnight Cafe.">
  <meta property="og:image" content="https://overnightcafe-app.web.app/logo.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://overnightcafe-app.web.app/">
  <meta property="twitter:title" content="Overnight Cafe">
  <meta property="twitter:description" content="Sip, Savour & Stay Overnight. Order online or walk-in at Overnight Cafe.">
  <meta property="twitter:image" content="https://overnightcafe-app.web.app/logo.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Overnight Cafe">
  <link rel="apple-touch-icon" href="logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png"/>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
