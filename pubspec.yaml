name: cafe_management_system
description: A Café Management System frontend (Admin / Employee / Customer) built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  google_mlkit_text_recognition: ^0.14.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.1
  image: ^4.1.7
  permission_handler: ^11.3.1
  flutter_blue_plus: ^1.32.12
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "lib/theme/OC_APP_LOGO_BNW.png"
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
